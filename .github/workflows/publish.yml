name: Publish package registry

on:
  push:
    branches:
      - main
  # Re-sign weekly: the index expires 30 days after signing.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # "Submit package" calls it after an automatic merge: a merge done with
  # GITHUB_TOKEN does not start the push trigger (issue #21).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and sign registry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment provides the repository signing seed.
    environment:
      name: github-pages
    steps:
      - name: "Setup | Checkout approved main"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Always main: a caller's event can point at an earlier commit.
          ref: main
          persist-credentials: false
      - name: "Setup | Cache xila-package"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: xila-package-${{ hashFiles('tools/xila-package.sh') }}
      - name: "Validate | Keys, entries and archives"
        run: bash tools/validate.sh
      - name: "Sign | Registry metadata with the repository key"
        env:
          XILA_REGISTRY_SIGNING_SEED_B64: ${{ secrets.XILA_REGISTRY_SIGNING_SEED_B64 }}
        run: bash tools/sign.sh
      - name: "Publish | Upload registry site"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  # The deployment runs in its own job. `actions/deploy-pages` lists the
  # artifacts of the run once, without retry. The artifact service lists a new
  # artifact up to a few seconds after the upload step ends. In the same job,
  # the listing came back empty and the deployment failed (issue #16).
  deploy:
    name: Deploy registry metadata to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Publish | Deploy Pages"
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
