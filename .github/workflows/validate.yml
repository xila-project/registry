name: Validate package registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and generate a static preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Setup | Checkout registry"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Setup | Install pinned Rust"
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: "Setup | Cache xila-package"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Only the final binary is cached; the build never writes here.
          path: .tools/xila-package
          key: xila-package-${{ hashFiles('tools/xila-package.sh') }}
      - name: "Setup | Install and verify xila-package"
        run: bash tools/xila-package.sh
      - name: "Test | Validation rules"
        run: bash tools/test.sh
      - name: "Validate | Keys, entries and archives"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            bash tools/validate.sh "origin/$BASE_REF"
          else
            bash tools/validate.sh
          fi
      - name: "Report | Upload registry site"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-site
          path: _site/
          if-no-files-found: error

  required:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          VALIDATE: ${{ needs.validate.result }}
        run: test "$VALIDATE" = success
