name: Package submission

# Starts "Submit package" for an issue opened with the "Submit a package"
# form (label package-submission, which only the form or a maintainer sets).
# The issue body is untrusted: tools/parse_submission_issue.sh reads it from
# the event file, and no expression places it in a shell command.
# An edit starts a run only when the issue body changed: title-only edits and
# spam edits do not (issue #26).

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

# One run at a time for each issue; a newer edit replaces a pending run.
concurrency:
  group: package-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  parse:
    name: Read the submission form
    # `github.event.changes.body` is present only when an edit changed the
    # body, so an `edited` event without it (a title change, for example) is
    # skipped.
    if: >-
      github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'package-submission')
      && (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      archive-url: ${{ steps.parse.outputs.archive-url }}
      archive-sha256: ${{ steps.parse.outputs.archive-sha256 }}
      publisher: ${{ steps.parse.outputs.publisher }}
      public-key: ${{ steps.parse.outputs.public-key }}
      author: ${{ steps.parse.outputs.author }}
    steps:
      - name: "Setup | Checkout registry"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: "Validate | Read the form fields"
        id: parse
        run: bash tools/parse_submission_issue.sh "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  # `secrets: inherit` is required for the nested `publish.yml` job to read
  # the `github-pages` environment signing seed after an automatic merge.
  # `prepare` and `propose` declare no `environment:` (so they cannot read
  # that environment secret) and must never reference `secrets.*`.
  submit:
    name: Submit
    needs: parse
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      issues: write
      pages: write
      id-token: write
    uses: ./.github/workflows/submit-package.yml
    secrets: inherit
    with:
      archive-url: ${{ needs.parse.outputs.archive-url }}
      archive-sha256: ${{ needs.parse.outputs.archive-sha256 }}
      publisher: ${{ needs.parse.outputs.publisher }}
      public-key: ${{ needs.parse.outputs.public-key }}
      author: ${{ needs.parse.outputs.author }}
      submitter: ${{ github.event.issue.user.login }}
      issue: ${{ github.event.issue.number }}
